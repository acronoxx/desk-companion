; PlatformIO project for the Desk Companion ESP32.
; Open the firmware/ folder itself in VS Code (File > Open Folder) so the
; PlatformIO extension detects it.

[env:esp32dev]
board_build.partitions = min_spiffs.csv
platform = espressif32
board = esp32dev            ; generic ESP32 DevKit, change it once the board is known
framework = arduino
monitor_speed = 115200      ; Serial.begin(115200)
lib_deps =
    tzapu/WiFiManager
    bblanchon/ArduinoJson@^7
